# cargo audit configuration, read locally and by the `audit` job of check.yml.

[advisories]
ignore = [
    # The SQLite bundled by libsqlite3-sys < 0.39 can return uninitialized
    # page-cache memory for a crafted database and `-wal` pair. sqlx 0.8.6 and
    # the latest release 0.9.0 cap libsqlite3-sys below 0.38; the fixed bound is
    # on sqlx main only. Remove this entry once a sqlx release allows 0.39:
    # https://github.com/transact-rs/sqlx/issues/4516
    "RUSTSEC-2026-0459",
]
