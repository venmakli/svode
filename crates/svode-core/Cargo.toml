[package]
name = "svode-core"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = "0.4"
serde_yml = "0.0.12"
unicode-casefold = "0.2"
unicode-normalization = "0.1"
which = "7"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "macros", "rt"] }
ulid = "1"
tempfile = "3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
