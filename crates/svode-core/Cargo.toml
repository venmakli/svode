[package]
name = "svode-core"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ulid = "1"
tempfile = "3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
