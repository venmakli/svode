[package]
name = "svode-lfs"
version = "0.0.1"
edition = "2024"
authors = ["Kamnev Ilya"]
repository = "https://github.com/venmakli/svode"
description = "Git LFS Custom Transfer Agent for Svode — uploads/downloads asset blobs to S3-compatible storage via OpenDAL."

[[bin]]
name = "svode-lfs"
path = "src/main.rs"

[dependencies]
svode-core = { path = "../svode-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "fs", "sync", "time"] }
opendal = { version = "0.58.1", features = ["services-s3"] }
# The upload transport: the same reqwest and TLS as the default OpenDAL one.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
http = "1"
http-body = "1"
bytes = "1"
futures = "0.3"
anyhow = "1"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
