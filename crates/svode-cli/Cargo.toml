[package]
name = "svode-cli"
version = "0.0.8"
edition = "2024"
authors = ["Kamnev Ilya"]
repository = "https://github.com/venmakli/svode"
description = "Svode CLI: the `svode` command for reading and changing Svode project data without the desktop app."

[lib]
name = "svode_cli"
path = "src/lib.rs"

[[bin]]
name = "svode"
path = "src/main.rs"

[dependencies]
svode-connect = { path = "../svode-connect" }
svode-core = { path = "../svode-core" }
svode-tools = { path = "../svode-tools" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt", "macros", "signal"] }

[dev-dependencies]
svode-install = { path = "../svode-install" }
tempfile = "3"
