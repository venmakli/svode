[package]
name = "svode-install"
version = "0.0.8"
edition = "2024"
authors = ["Kamnev Ilya"]
repository = "https://github.com/venmakli/svode"
description = "Svode runtime installation: the stable location ~/.svode with its launchers, the active installation and the standalone installer."

[lib]
name = "svode_install"
path = "src/lib.rs"

[[bin]]
name = "svode-launcher"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
