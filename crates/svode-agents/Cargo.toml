[package]
name = "svode-agents"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"

[dependencies]
svode-core = { path = "../svode-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "macros", "rt", "io-util", "sync"] }
ulid = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["process", "time", "macros", "rt", "rt-multi-thread", "io-util", "sync"] }
