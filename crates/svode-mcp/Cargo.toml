[package]
name = "svode-mcp"
version = "0.0.8"
edition = "2024"
authors = ["Kamnev Ilya"]
repository = "https://github.com/venmakli/svode"
description = "Svode MCP server: public tool mapping over svode-core, stdio transport, desktop bridge client and client config management."

[lib]
name = "svode_mcp"
path = "src/lib.rs"

[[bin]]
name = "svode-mcp"
path = "src/main.rs"

[dependencies]
svode-core = { path = "../svode-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
toml = "0.9"
tracing = "0.1"
ulid = "1"
which = "7"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
