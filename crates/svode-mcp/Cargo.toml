[package]
name = "svode-mcp"
version = "0.0.8"
edition = "2024"
authors = ["Kamnev Ilya"]
repository = "https://github.com/venmakli/svode"
description = "Svode MCP server: MCP control plane over the svode-tools surface, stdio transport, desktop bridge client and client config management."

[lib]
name = "svode_mcp"
path = "src/lib.rs"

[[bin]]
name = "svode-mcp"
path = "src/main.rs"

[dependencies]
svode-tools = { path = "../svode-tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
toml = "0.9"
ulid = "1"
which = "7"

[dev-dependencies]
svode-core = { path = "../svode-core" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
