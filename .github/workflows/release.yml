name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release_notes:
    runs-on: ubuntu-22.04
    outputs:
      body: ${{ steps.extract.outputs.body }}
    steps:
      - uses: actions/checkout@v6

      - name: Extract release notes from CHANGELOG.md
        id: extract
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          body="$(awk -v version="$version" '
            $0 == "## [" version "]" || $0 ~ "^## \\[" version "\\] - " { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]:/ { exit }
            found { print }
          ' CHANGELOG.md)"

          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md does not contain release notes for ${version}" >&2
            exit 1
          fi

          {
            echo "body<<EOF"
            printf "%s\n" "$body"
            echo EOF
          } >> "$GITHUB_OUTPUT"

  quality:
    uses: ./.github/workflows/check.yml

  # One draft release that every platform uploads into, since the macOS app is
  # packed outside tauri-action.
  create_release:
    needs:
      - release_notes
      - quality
    runs-on: ubuntu-22.04
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - name: Create the draft release
        id: create
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ needs.release_notes.outputs.body }}
        run: |
          printf '%s\n' "$NOTES" > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --prerelease \
            --verify-tag \
            --title "Svode $GITHUB_REF_NAME" \
            --notes-file notes.md
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq "[.[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\")][0].id")"
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs:
      - create_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app"
          - platform: ubuntu-22.04
            args: "--bundles deb"
          - platform: windows-latest
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve build commit
        id: build_meta
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@1.97.0
        if: matrix.platform != 'macos-latest'

      - uses: dtolnay/rust-toolchain@1.97.0
        if: matrix.platform == 'macos-latest'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsecret-1-dev \
            libasound2-dev

      - name: Install the Vulkan SDK for the speech engine
        if: matrix.platform != 'macos-latest'
        uses: ./.github/actions/vulkan-sdk

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        if: matrix.platform != 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SVODE_BUILD_COMMIT: ${{ steps.build_meta.outputs.sha }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create_release.outputs.id }}
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Build the macOS app
        if: matrix.platform == 'macos-latest'
        env:
          VITE_SVODE_BUILD_COMMIT: ${{ steps.build_meta.outputs.sha }}
        run: bun run --cwd apps/desktop tauri build ${{ matrix.args }}

      # The ad hoc signature of a plain build changes its requirement every
      # build, which resets macOS privacy grants on each update; the script pins
      # it to the bundle identifier and packs the dmg from the signed app.
      - name: Sign the macOS app with a stable identity and pack the dmg
        if: matrix.platform == 'macos-latest'
        run: node apps/desktop/scripts/macos-package.mjs target/universal-apple-darwin/release/bundle

      - name: Upload the dmg
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber
