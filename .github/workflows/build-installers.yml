name: build-installers

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to build
        required: true
        default: main
        type: string
      platform:
        description: Installer platform to build
        required: true
        default: windows
        type: choice
        options:
          - windows
          - macos
          - linux
          - all
      notify:
        description: Update dogfood notification feed
        required: true
        default: false
        type: boolean
      notice_reason:
        description: Short reason shown to dogfood users
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-installers-${{ github.event.inputs.platform }}-${{ github.event.inputs.ref }}
  cancel-in-progress: true

jobs:
  select-matrix:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      installed: ${{ steps.matrix.outputs.installed }}
    steps:
      - id: matrix
        shell: bash
        run: |
          windows='{"include":[{"platform":"windows-latest","feed_platform":"windows","args":"--bundles nsis","artifact_name":"Svode-windows-nsis","artifact_path":"target/release/bundle/nsis/*.exe"}]}'
          macos='{"include":[{"platform":"macos-latest","feed_platform":"darwin","args":"--target universal-apple-darwin --bundles app","artifact_name":"Svode-macos-dmg","artifact_path":"target/universal-apple-darwin/release/bundle/dmg/*.dmg"}]}'
          linux='{"include":[{"platform":"ubuntu-22.04","feed_platform":"linux","args":"--bundles deb","artifact_name":"Svode-linux-deb","artifact_path":"target/release/bundle/deb/*.deb"}]}'
          all='{"include":[{"platform":"macos-latest","feed_platform":"darwin","args":"--target universal-apple-darwin --bundles app","artifact_name":"Svode-macos-dmg","artifact_path":"target/universal-apple-darwin/release/bundle/dmg/*.dmg"},{"platform":"ubuntu-22.04","feed_platform":"linux","args":"--bundles deb","artifact_name":"Svode-linux-deb","artifact_path":"target/release/bundle/deb/*.deb"},{"platform":"windows-latest","feed_platform":"windows","args":"--bundles nsis","artifact_name":"Svode-windows-nsis","artifact_path":"target/release/bundle/nsis/*.exe"}]}'

          windows_installed='{"include":[{"platform":"windows-latest","artifact_name":"Svode-windows-nsis"}]}'
          linux_installed='{"include":[{"platform":"ubuntu-22.04","artifact_name":"Svode-linux-deb"}]}'
          all_installed='{"include":[{"platform":"ubuntu-22.04","artifact_name":"Svode-linux-deb"},{"platform":"windows-latest","artifact_name":"Svode-windows-nsis"}]}'

          case "${{ inputs.platform }}" in
            windows) matrix="$windows"; installed="$windows_installed" ;;
            macos) matrix="$macos"; installed="" ;;
            linux) matrix="$linux"; installed="$linux_installed" ;;
            all) matrix="$all"; installed="$all_installed" ;;
            *) echo "Unsupported platform: ${{ inputs.platform }}" >&2; exit 1 ;;
          esac

          {
            echo "matrix=$matrix"
            echo "installed=$installed"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: select-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-matrix.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve build metadata
        id: build_meta
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          version="$(node -e "console.log(JSON.parse(require('fs').readFileSync('apps/desktop/package.json', 'utf8')).version)")"

          {
            echo "sha=$sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@1.97.0
        if: matrix.platform != 'macos-latest'

      - uses: dtolnay/rust-toolchain@1.97.0
        if: matrix.platform == 'macos-latest'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsecret-1-dev \
            libasound2-dev

      - name: Install the Vulkan SDK for the speech engine
        if: matrix.platform != 'macos-latest'
        uses: ./.github/actions/vulkan-sdk

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build installer
        env:
          VITE_SVODE_BUILD_COMMIT: ${{ steps.build_meta.outputs.sha }}
        run: bun run --cwd apps/desktop tauri build ${{ matrix.args }}

      # The ad hoc signature of a plain build changes its requirement every
      # build, which resets macOS privacy grants on each update; the script pins
      # it to the bundle identifier and packs the dmg from the signed app.
      - name: Sign the macOS app with a stable identity and pack the dmg
        if: matrix.feed_platform == 'darwin'
        run: node apps/desktop/scripts/macos-package.mjs target/universal-apple-darwin/release/bundle

      - name: Upload installer artifact
        id: upload_installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 3

      - name: The installer carries the speech process and its engine
        shell: bash
        run: |
          case "${{ matrix.feed_platform }}" in
            darwin)
              dmg="$(ls ${{ matrix.artifact_path }})"
              hdiutil attach "$dmg" -mountpoint /tmp/svode-dmg -nobrowse -readonly
              codesign --verify --deep --strict /tmp/svode-dmg/Svode.app
              codesign -d -r- /tmp/svode-dmg/Svode.app | grep -qx 'designated => identifier "app.svode.desktop"'
              speech=/tmp/svode-dmg/Svode.app/Contents/MacOS/svode-speech
              test -x "$speech"
              lipo -archs "$speech" | grep -q x86_64
              lipo -archs "$speech" | grep -q arm64
              hdiutil detach /tmp/svode-dmg
              ;;
            linux)
              deb="$(ls ${{ matrix.artifact_path }})"
              dpkg-deb -c "$deb" | grep -Ei 'speech|transcribe|ggml' || true
              dpkg-deb -f "$deb" Depends
              dpkg-deb -c "$deb" | grep -E ' (\./)?usr/bin/svode-speech$'
              dpkg-deb -c "$deb" | grep -E ' (\./)?usr/lib/Svode/speech/libtranscribe\.so'
              dpkg-deb -c "$deb" | grep -E ' (\./)?usr/lib/Svode/speech/libggml-vulkan\.so'
              dpkg-deb -f "$deb" Depends | grep -q libvulkan1
              dpkg-deb -f "$deb" Depends | grep -q libasound2
              ;;
            windows)
              installer="$(ls ${{ matrix.artifact_path }})"
              listing="$(7z l "$installer")"
              grep -Ei 'speech|transcribe|ggml' <<<"$listing" || true
              grep -qi 'svode-speech\.exe' <<<"$listing"
              grep -qi 'transcribe\.dll' <<<"$listing"
              grep -qi 'ggml-vulkan\.dll' <<<"$listing"
              ;;
          esac

      - name: Prepare dogfood feed metadata
        if: ${{ inputs.notify }}
        id: feed_meta
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const now = new Date();
          const expires = new Date(now.getTime() + 3 * 24 * 60 * 60 * 1000);
          console.log(`published_at=${now.toISOString()}`);
          console.log(`expires_at=${expires.toISOString()}`);
          NODE

      - name: Update dogfood feed
        if: ${{ inputs.notify }}
        env:
          UPDATE_KIND: ci-build
          UPDATE_VERSION: ${{ steps.build_meta.outputs.version }}
          UPDATE_COMMIT: ${{ steps.build_meta.outputs.sha }}
          UPDATE_SOURCE_REF: ${{ inputs.ref }}
          UPDATE_RUN_ID: ${{ github.run_id }}
          UPDATE_PLATFORM: ${{ matrix.feed_platform }}
          UPDATE_ARTIFACT_NAME: ${{ matrix.artifact_name }}
          UPDATE_URL: ${{ steps.upload_installer.outputs.artifact-url }}
          UPDATE_FALLBACK_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPDATE_REASON: ${{ inputs.notice_reason }}
          UPDATE_PUBLISHED_AT: ${{ steps.feed_meta.outputs.published_at }}
          UPDATE_EXPIRES_AT: ${{ steps.feed_meta.outputs.expires_at }}
        run: node scripts/update-dogfood-feed.mjs

  installed:
    # The speech process of the installed package on the OSes checked without
    # a live device (Stage 10 `06`): the NSIS installer runs silently on a
    # runner without the Vulkan SDK, the .deb goes with its declared
    # dependencies only into clean Ubuntu containers. The installed
    # svode-speech then installs the compact catalog model from a local file
    # with its SHA-256 checked, prepares it and recognizes the reference
    # recording on the CPU, since the runners have no GPU.
    needs:
      - select-matrix
      - build
    if: needs.select-matrix.outputs.installed != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-matrix.outputs.installed) }}
    runs-on: ${{ matrix.platform }}
    env:
      SVODE_SPEECH_EXPECT_BACKEND: cpu
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: speech-installed

      # The host library only, without the engine: what runs the engine is
      # the installed package.
      - name: Build the check of the installed speech process
        run: cargo build --release -p svode-speech --no-default-features --example installed

      - name: Restore the speech test model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/speech-test
          key: speech-test-model-${{ hashFiles('scripts/fetch-speech-test-model.mjs') }}

      - name: Speech test model
        shell: bash
        env:
          SVODE_SPEECH_TEST_MODEL: ${{ runner.temp }}/speech-test/whisper-tiny-Q8_0.gguf
        run: echo "SVODE_SPEECH_TEST_MODEL=$(node scripts/fetch-speech-test-model.mjs)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: installer

      - name: The .deb installs into clean containers and its speech process recognizes on the CPU
        if: runner.os == 'Linux'
        shell: bash
        run: |
          model_dir="$(dirname "$SVODE_SPEECH_TEST_MODEL")"
          model_file="$(basename "$SVODE_SPEECH_TEST_MODEL")"
          for image in ubuntu:22.04 ubuntu:24.04; do
            echo "::group::$image"
            docker run --rm \
              -v "$PWD/installer:/installer:ro" \
              -v "$PWD/target/release/examples:/check:ro" \
              -v "$model_dir:/model:ro" \
              -e SVODE_SPEECH_EXPECT_BACKEND \
              -e DEBIAN_FRONTEND=noninteractive \
              "$image" bash -euo pipefail -c "
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends /installer/*.deb
                ldd /usr/bin/svode-speech
                if ldd /usr/bin/svode-speech | grep -q 'not found'; then exit 1; fi
                ls /usr/lib/Svode/speech
                /check/installed /usr/bin/svode-speech /model/$model_file
              "
            echo "::endgroup::"
          done

      - name: The NSIS installer installs silently and its speech process recognizes on the CPU
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem installer -Filter *-setup.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'Svode'
          # /D sets the install directory and must come last, unquoted.
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS install failed ($($process.ExitCode))" }
          Get-ChildItem $dir | Select-Object -ExpandProperty Name
          Write-Output "Vulkan loader present: $(Test-Path "$env:SystemRoot\System32\vulkan-1.dll")"
          $speech = Join-Path $dir 'svode-speech.exe'
          if (-not (Test-Path $speech)) { throw "the installed package has no svode-speech.exe" }
          & target\release\examples\installed.exe $speech $env:SVODE_SPEECH_TEST_MODEL
          if ($LASTEXITCODE -ne 0) { throw "the installed speech process check failed" }
