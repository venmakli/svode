name: Stage 12 Windows dogfood checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dogfood-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: d633ea8c78da3b2242bf878e7ec2cc93652e0b3f
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: stage12-dogfood-windows
      - name: Verify revision and Git tools
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne 'd633ea8c78da3b2242bf878e7ec2cc93652e0b3f') {
            throw 'Unexpected application revision'
          }
          git --version
          git lfs version
      - name: DF-379 publication destination and Windows drive paths
        run: cargo test -p svode-core --lib -- the_user_part_leaves_url_and_scp_forms_of_every_scheme urls_without_a_user_part_stay_as_configured a_windows_drive_path_is_local_only_on_windows
      - name: DF-380 exact LFS paths and policy recovery with Git for Windows
        if: success() || failure()
        run: >-
          cargo test -p svode-core --lib --
          an_lfs_path_rule_with_whitespace_quotes_the_escaped_pattern
          git_applies_each_exact_lfs_rule_to_exactly_its_path
          exact_path_rules_unlike_their_metadata_make_the_lfs_policy_stale
          reapplying_the_lfs_policy_repairs_an_old_exact_rule_without_new_paths
          leaving_local_for_lfs_routes_a_released_name_with_spaces_to_lfs
