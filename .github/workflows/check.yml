name: check

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/desktop typecheck

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsecret-1-dev \
            libasound2-dev
      - uses: oven-sh/setup-bun@v2
      - run: bun run --cwd apps/desktop check:sidecars
      - name: Host-free packages do not depend on Tauri or the desktop crate
        run: bun run check:crates
      # svode-speech builds its engine with Vulkan on Linux, which needs the
      # Vulkan SDK; the speech job below checks and tests it.
      - run: cargo check --workspace --all-targets --exclude svode-speech
      - name: Core package tests without the desktop crate
        run: cargo test -p svode-core
      - name: Tool surface package tests without the desktop crate
        run: cargo test -p svode-tools
      - name: MCP package tests without the desktop crate
        run: cargo test -p svode-mcp
      - name: CLI package tests without the desktop crate
        run: cargo test -p svode-cli
      - name: Connection manager tests without the desktop crate
        run: cargo test -p svode-connect
      - name: Agent runtime tests without the desktop crate
        run: cargo test -p svode-agents
      # Building the desktop crate copies the sidecar placeholders over the
      # svode, svode-mcp and svode-launcher binaries their packages' tests
      # run, so those packages are tested by their own steps above and in
      # standalone-linux, without the desktop crate.
      - name: Workspace tests
        run: cargo test --workspace --exclude svode-speech --exclude svode-cli --exclude svode-mcp --exclude svode-install
      - name: Clippy
        run: |
          cargo clippy --workspace --exclude svode-speech -- \
            -D warnings \
            -A clippy::collapsible_if \
            -A clippy::type_complexity \
            -A clippy::too_many_arguments \
            -A clippy::needless_return \
            -A clippy::collapsible_str_replace \
            -A clippy::question_mark \
            -A clippy::cloned_ref_to_slice_refs \
            -A clippy::ptr_arg \
            -A clippy::redundant_pattern_matching \
            -A clippy::manual_contains \
            -A clippy::needless_lifetimes \
            -A clippy::derivable_impls \
            -A clippy::obfuscated_if_else \
            -A clippy::needless_borrow \
            -A clippy::needless_borrows_for_generic_args

  speech:
    # The speech recognition process on the OSes checked without a live
    # device (Stage 10 `06`): built as it ships, with Vulkan and loadable
    # backend modules, and tested through real processes on runners without
    # a GPU, where the engine must pick the CPU and recognize a fixture with
    # a small catalog model.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SVODE_SPEECH_REQUIRE_MODEL: "1"
      SVODE_SPEECH_EXPECT_BACKEND: cpu
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      # Not the target directory: the cache drops the engine DLLs the native
      # build stages next to the test binaries on Windows, and a fresh build
      # script does not stage them again.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: speech
          cache-targets: false
      - uses: ./.github/actions/vulkan-sdk
      - name: Restore the speech test model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/speech-test
          key: speech-test-model-${{ hashFiles('scripts/fetch-speech-test-model.mjs') }}
      - name: Speech test model
        shell: bash
        env:
          SVODE_SPEECH_TEST_MODEL: ${{ runner.temp }}/speech-test/whisper-tiny-Q8_0.gguf
        run: echo "SVODE_SPEECH_TEST_MODEL=$(node scripts/fetch-speech-test-model.mjs)" >> "$GITHUB_ENV"
      - name: Speech process tests
        run: cargo test -p svode-speech
      - name: Clippy
        run: cargo clippy -p svode-speech --all-targets -- -D warnings

  native-readers-windows:
    # The native session readers of Stage 10 `07` on Windows, which no live
    # device checks: their store fixtures, the store paths of this OS, the
    # liveness signal of a live and an exited child process and the Cursor
    # chat folders of Windows paths; and the local paths of the chat of `08`.
    # Linux runs them with the workspace tests of the rust job.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: native-readers
      - uses: oven-sh/setup-bun@v2
      - run: bun run --cwd apps/desktop check:sidecars
      # The desktop crate gets the Common Controls v6 manifest from Tauri's
      # resource for its binary alone, so its test binary would not start
      # (STATUS_ENTRYPOINT_NOT_FOUND, tauri-apps/tauri#13419); the linker
      # embeds the same manifest into the test binaries.
      - name: Common Controls manifest for the test binaries
        shell: pwsh
        run: |
          $manifest = Join-Path $env:RUNNER_TEMP 'common-controls.manifest'
          Set-Content -Path $manifest -Encoding utf8 -Value @'
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <dependency>
              <dependentAssembly>
                <assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0" processorArchitecture="*" publicKeyToken="6595b64144ccf1df" language="*" />
              </dependentAssembly>
            </dependency>
          </assembly>
          '@
          "RUSTFLAGS=-C link-arg=/MANIFEST:EMBED -C link-arg=/MANIFESTINPUT:$manifest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # The other tests of the agent runtime still assume Unix paths.
      - name: Native stores and identities of the agent descriptions
        run: cargo test -p svode-agents -- identity::tests registry::tests::an_agent_without_a_description registry::tests::cursor_lists registry::tests::grok_build_declares registry::tests::hermes_lists registry::tests::opencode_declares registry::tests::qwen_code_runs_its_acp_flag
      - name: Native session reader tests
        run: cargo test -p svode-desktop --lib -- agent_sessions::native_status agent_sessions::native_catalog agent_sessions::read_model agent_sessions::live_status
      # The local paths of the chat of Stage 10 `08` on Windows: drive paths
      # in either separator and their verbatim form, folder links, and no
      # filesystem access for a network share.
      - name: Chat paths of the system path helpers
        run: cargo test -p svode-core --lib -- system_path::tests
      - name: Chat paths of the agent runtime
        run: cargo test -p svode-agents -- prompt::tests changes::tests::a_path_on_a_network_share changes::tests::a_path_in_a_canonical_space acp::media::tests::a_network_share acp::media::tests::windows_drive_paths
      - name: Chat paths of Desktop
        run: cargo test -p svode-desktop --lib -- commands::space::tests::path_kind media::source::tests::a_local_file shell_open_scope
      # The paths WebView2 hands for files dropped from the Explorer, built
      # with the WebView2 host code of this OS, and the network share refusal
      # of a terminal drop.
      - name: Dropped file paths of Desktop
        run: cargo test -p svode-desktop --lib -- webview_file_drop terminal::tests::terminal_paths_reject_a_network_share app_windows::tests::the_first_window_of_linux

  standalone-linux:
    # svode and svode-mcp as scripts and CI use them on Linux x86_64: built,
    # tested through real processes and smoke-checked without the desktop
    # app or its GUI libraries, then packed with svode-lfs and the plugin
    # payload into the standalone archive, which the installer puts into the
    # stable location of a user without Svode.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: standalone
      - name: Install the build dependency of the OS keychain client
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build the standalone binaries
        run: cargo build -p svode-cli -p svode-mcp -p svode-lfs -p svode-install
      - name: The binaries link no desktop GUI library
        run: |
          ldd target/debug/svode target/debug/svode-mcp
          if ldd target/debug/svode target/debug/svode-mcp | grep -Ei 'gtk|webkit|appindicator|rsvg'; then
            exit 1
          fi
      - name: Every command and tool through real processes
        run: cargo test -p svode-cli -p svode-mcp -p svode-install -p svode-connect
      - name: Packaging smoke
        run: node scripts/smoke-standalone.mjs target/debug
      - name: Standalone archive with the plugin payload of the same version, installed for a user without Svode
        run: |
          archive="$(node scripts/standalone-archive.mjs target/debug target/standalone)"
          rm -rf target/standalone/unpacked
          mkdir -p target/standalone/unpacked
          tar -xzf "$archive" -C target/standalone/unpacked
          root="$(find target/standalone/unpacked -mindepth 1 -maxdepth 1 -type d)"
          node scripts/plugin-payload.mjs check "$root/plugins/svode" "$root/bin/svode"
          node scripts/smoke-install.mjs "$archive"

  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/audit@v1
        with:
          workingDirectory: .
          createIssues: false
